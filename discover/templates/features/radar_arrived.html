<div class="callout ok rd-arrived" role="status">
  {{ icon('check') }}<span><b>Arrived:</b> {% for a in R.arrivals %}{{ a.title }}{{ ' (now digital)' if a.how == 'digital' }}{{ ', ' if not loop.last }}{% endfor %}</span>
  <button class="btn icon ghost" data-radar-dismiss aria-label="Dismiss">{{ icon('x') }}</button>
</div>
