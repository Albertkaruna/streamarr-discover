<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign in · Discover</title>
<meta name="theme-color" content="#0b1020"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css?v=1"></head>
<body class="login"><main><form method="post" action="/login">
<img class="logo" src="/static/icon.svg" alt=""><h1>Discover</h1><div class="sub">by Streamarr</div>
{% if err %}<div class="err">{{ err }}</div>{% endif %}
<label for="u">Username</label><input id="u" name="user" autocomplete="username" autocapitalize="none" required autofocus>
<label for="p">Password</label><input id="p" name="pw" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button><div class="foot">Livin' the Stream Life</div>
</form></main></body></html>
