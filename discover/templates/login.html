<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign in · Discover</title>
<meta name="theme-color" content="#0a0b0f"><meta name="color-scheme" content="dark"><link rel="manifest" href="/manifest.json">
<link rel="icon" href="{{ asset('/static/icon.svg') }}"><link rel="stylesheet" href="{{ css_url() }}"></head>
<body class="login"><main><form method="post" action="/login">
<img class="logo" src="{{ asset('/static/icon.svg') }}" alt="" width="56" height="56"><h1>Sign in to Discover</h1>
<p class="sub">Personal picks for your Streamarr server</p>
{% if err %}<div class="err" role="alert">{{ err }}</div>{% endif %}
<label for="u">Username</label><input id="u" name="user" autocomplete="username" autocapitalize="none" required autofocus>
<label for="p">Password</label><input id="p" name="pw" type="password" autocomplete="current-password" required>
<button class="btn primary" type="submit">Sign in</button>
</form></main></body></html>
